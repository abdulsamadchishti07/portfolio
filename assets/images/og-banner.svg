<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111219"/>
      <stop offset="50%" stop-color="#0c0d12"/>
      <stop offset="100%" stop-color="#07080c"/>
    </linearGradient>
    <radialGradient id="violet-glow" cx="22%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#b49cff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0c0d12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emerald-glow" cx="85%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#4eedb0" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0c0d12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="holographic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b49cff"/>
      <stop offset="55%" stop-color="#4eedb0"/>
      <stop offset="100%" stop-color="#8ce3f5"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#violet-glow)"/>
  <rect width="1200" height="675" fill="url(#emerald-glow)"/>

  <!-- Subtle Blueprint Grid -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="240" y1="0" x2="240" y2="675"/>
    <line x1="480" y1="0" x2="480" y2="675"/>
    <line x1="720" y1="0" x2="720" y2="675"/>
    <line x1="960" y1="0" x2="960" y2="675"/>
  </g>

  <!-- Outer Border Frame -->
  <rect x="30" y="30" width="1140" height="615" rx="16" fill="none" stroke="rgba(239,233,221,0.08)" stroke-width="1.5"/>

  <!-- Top Kicker Pill -->
  <g transform="translate(80, 80)">
    <rect width="430" height="38" rx="19" fill="rgba(239,233,221,0.05)" stroke="rgba(180,156,255,0.3)" stroke-width="1"/>
    <circle cx="24" cy="19" r="4.5" fill="#4eedb0"/>
    <text x="40" y="23.5" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#efe9dd" letter-spacing="1.5">ABDUL SAMAD CHISHTI · BACKEND ARCH</text>
  </g>

  <!-- Domain Badge Top Right -->
  <g transform="translate(1120, 80)">
    <text x="0" y="25" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="500" fill="#b49cff" letter-spacing="1">abdulsamadchishti.dev</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(80, 210)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="62" font-weight="800" fill="#efe9dd" letter-spacing="-1.5">Backend Systems.</text>
    <text x="0" y="76" font-family="'Plus Jakarta Sans', sans-serif" font-size="62" font-weight="800" fill="url(#holographic)" letter-spacing="-1.5">Built not to break.</text>

    <!-- Subtitle Bullet points -->
    <text x="0" y="145" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="500" fill="rgba(239,233,221,0.85)" letter-spacing="0.3">Concurrent APIs · Distributed Locking</text>
    <text x="0" y="174" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="400" fill="rgba(239,233,221,0.55)" letter-spacing="0.3">Multi-Tenant RBAC · ACID Invariants</text>
  </g>

  <!-- Architecture Pipeline Terminal Card -->
  <g transform="translate(640, 190)">
    <rect width="480" height="360" rx="14" fill="rgba(10,11,16,0.94)" stroke="rgba(180,156,255,0.35)" stroke-width="1.2"/>
    
    <!-- Window Header -->
    <path d="M0,14 Q0,0 14,0 L466,0 Q480,0 480,14 L480,40 L0,40 Z" fill="rgba(255,255,255,0.035)"/>
    <circle cx="24" cy="20" r="5" fill="#ff5f57"/>
    <circle cx="42" cy="20" r="5" fill="#febc2e"/>
    <circle cx="60" cy="20" r="5" fill="#28c840"/>
    <text x="84" y="24" font-family="'JetBrains Mono', monospace" font-size="12" fill="rgba(239,233,221,0.5)" letter-spacing="1">pipeline :: concurrency_lock.py</text>

    <!-- Pipeline Code Text with centered layout -->
    <g transform="translate(35, 75)" font-family="'JetBrains Mono', monospace" font-size="12.5" letter-spacing="0.5">
      <text x="0" y="0" fill="#efe9dd">[CLIENT: POST /api/v1/reserve]</text>
      <text x="100" y="22" fill="#b49cff">│</text>
      <text x="100" y="42" fill="#b49cff">▼</text>
      <text x="0" y="64" fill="#4eedb0">[LOCK: redis.acquire(ttl=30s)]</text>
      <text x="100" y="86" fill="#b49cff">│</text>
      <text x="100" y="106" fill="#b49cff">▼</text>
      <text x="0" y="128" fill="#efe9dd">[ACID TX: Postgres SELECT FOR UPDATE]</text>
      <text x="100" y="150" fill="#b49cff">│</text>
      <text x="100" y="170" fill="#b49cff">▼</text>
      <text x="0" y="192" fill="#8ce3f5">[STATUS: 201 CREATED · 34ms]</text>
      
      <!-- Invariant guarantee -->
      <rect x="-10" y="216" width="430" height="32" rx="6" fill="rgba(78,237,176,0.08)" stroke="rgba(78,237,176,0.25)" stroke-width="1"/>
      <text x="10" y="237" font-size="11.5" fill="#4eedb0" font-weight="600">✓ Zero Overbooking Invariants Guaranteed</text>
    </g>
  </g>

  <!-- Tech Stack Chips Bottom Left -->
  <g transform="translate(80, 500)">
    <!-- Python -->
    <rect x="0" y="0" width="95" height="34" rx="7" fill="rgba(239,233,221,0.06)" stroke="rgba(239,233,221,0.12)" stroke-width="1"/>
    <text x="47" y="21.5" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="600" fill="#efe9dd">Python</text>

    <!-- FastAPI -->
    <rect x="107" y="0" width="100" height="34" rx="7" fill="rgba(239,233,221,0.06)" stroke="rgba(239,233,221,0.12)" stroke-width="1"/>
    <text x="157" y="21.5" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="600" fill="#4eedb0">FastAPI</text>

    <!-- PostgreSQL -->
    <rect x="219" y="0" width="125" height="34" rx="7" fill="rgba(239,233,221,0.06)" stroke="rgba(239,233,221,0.12)" stroke-width="1"/>
    <text x="281" y="21.5" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="600" fill="#b49cff">PostgreSQL</text>

    <!-- Redis -->
    <rect x="356" y="0" width="85" height="34" rx="7" fill="rgba(239,233,221,0.06)" stroke="rgba(239,233,221,0.12)" stroke-width="1"/>
    <text x="398" y="21.5" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="600" fill="#ff7b72">Redis</text>

    <!-- Docker -->
    <rect x="453" y="0" width="95" height="34" rx="7" fill="rgba(239,233,221,0.06)" stroke="rgba(239,233,221,0.12)" stroke-width="1"/>
    <text x="500" y="21.5" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="600" fill="#8ce3f5">Docker</text>
  </g>

  <!-- Bottom Terminal Prompt -->
  <g transform="translate(80, 585)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="14" fill="rgba(239,233,221,0.45)">samad@production:~# <tspan fill="#efe9dd">uvicorn main:app --workers 4</tspan> <tspan fill="#4eedb0">[ONLINE · 99.98% SLA]</tspan></text>
  </g>
</svg>